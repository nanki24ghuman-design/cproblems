//Enter a number from the user and print that number 100 times?
#include<stdio.h>
int main()
{
int num,i;
printf("enter the number:");
scanf("%d",&num);
for(i=1;i<=100;i++)
{
printf("%d ",num);
}
printf("\n");
return 0;
}
