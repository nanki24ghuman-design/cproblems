//write a program to print pattern on the screen i.e.11111 11111 11111
#include<stdio.h>
int main()
{
int i,j;
for(j=1;j<=3;j++)
{
	for(i=1;i<=5;i++)
	{
	printf("1");
	}
printf(" ");
}
return 0;
}	/* output: 11111 11111 11111*/
