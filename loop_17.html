//enter a number from the user and find out factorial of that number?
#include<stdio.h>
int main()
{
int i,n,fact=1;;
printf("Enter a number ");
scanf("%d",&n);
for(i=1;i<=n;i++){
fact=fact*i;
}
printf("Factorial is %d",fact);
return 0;
}
/*
enter a number 5
factorial is 120
