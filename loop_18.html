//enter 2 numbers from the user and print range from 1st number to 2nd number?
#include<stdio.h>
int  main()
{
int x,y,i;
printf("Enter two numbers ");
scanf("%d %d",&x,&y);
printf(" Numbers from %d to %d",x,y);
for(i=x;i<=y;i++){
printf("\n %d ",i);
}
return 0;
}
